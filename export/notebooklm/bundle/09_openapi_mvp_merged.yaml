          - "$ref": "#/components/schemas/UuidString"
          - type: 'null'
          description: Персональная номенклатура — GUID контрагента-владельца.
        sku:
          type: string
        name:
          type: string
        brand:
          type: string
        description:
          type: string
        productionTimeDays:
          type: integer
          minimum: 0
        unitsPerBox:
          type: integer
          minimum: 1
        attributes:
          type: array
          items:
            "$ref": "#/components/schemas/ProductAttributeBinding"
        marketplaceUrls:
          type: array
          items:
            "$ref": "#/components/schemas/SyncProductMarketplaceUrl"
        isArchived:
          type: boolean
        images:
          type: array
          items:
            "$ref": "#/components/schemas/SyncProductImage"
    SyncStockItem:
      type: object
      additionalProperties: false
      required:
      - productGuid
      - characteristicGuid
      - stockQty
      properties:
        productGuid:
          "$ref": "#/components/schemas/UuidString"
        characteristicGuid:
          "$ref": "#/components/schemas/UuidString"
        stockQty:
          type: number
          description: Остаток в базовых единицах учёта.
    SyncPriceItem:
