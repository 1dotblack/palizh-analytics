          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
              example:
                id: 1
                sku: PLZ-000123
                slug: medovik-1
                category:
                  id: 1
                  name: Торты
                  slug: cakes
                  children: []
                brand:
                  id: 1
                  name: Палыч
                name: Торт Медовик
                description: Описание товара.
                productionTimeDays: 2
                unitsPerBox: 12
                marketplaceUrls:
                  - type: ozon
                    url: https://ozon.ru/
                images:
                  - /storage/products/medovik-1.jpg
                  - /storage/products/medovik-2.jpg
                attributes:
                  worktype:
                    type: worktype
                    label: Типы работ
                    values: []
                  compatibility:
                    type: compatibility
                    label: Совместимость
                    values:
                      - id: 2
                        value: Ложка
                        subvalue:
                          value: compatible
                          label: Совместимый
                  tinting_method:
                    type: tinting_method
                    label: Способ колерования
                    values: []
                  special:
                    type: special
                    label: Специальные свойства
                    values: []
                  surface:
                    type: surface
                    label: Обрабатываемая поверхность
                    values: []
                characteristics:
                  - id: 10
                    name: 1 кг
                    isSelected: true
                    stockQty: 12.5
                    userPrices:
                      - id: 1
                        currency: RUB
                        amount: '1290.50'
                        amountPerBox: '15486.00'
                        discountedAmount: '1190.50'
                        discountedAmountPerBox: '14286.00'
                        priceTypeCode: B2B_BASE
        '404':
          $ref: '#/components/responses/NotFoundError'

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags:
        - Auth
      summary: Запрос на восстановление пароля
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '204':
          description: No Content
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags:
        - Auth
      summary: Сброс пароля по токену
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '204':
          description: No Content
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'

  /auth/register:
    post:
      operationId: register
