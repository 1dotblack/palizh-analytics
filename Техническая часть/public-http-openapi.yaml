  /me:
    get:
      operationId: getMe
      tags:
        - Auth
      summary: Текущий пользователь
      security:
        - cookieAuth: []
      parameters:
        - name: withCounterparty
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Если `true`, подгружает контрагента и возвращает его в поле `counterparty`.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
    patch:
      operationId: updateMe
      tags:
        - Auth
      summary: Редактирование профиля
      description: Обновляет данные текущего пользователя (имя, email, телефон). Все поля опциональны, но хотя бы одно должно быть передано.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
        - name: withCounterparty
          in: query
          required: false
          schema:
            type: boolean
            default: false
          description: Если `true`, подгружает контрагента и возвращает его в поле `counterparty`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /me/change-password:
    post:
      operationId: changePassword
      tags:
        - Auth
      summary: Смена пароля
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '422':
          $ref: '#/components/responses/ValidationError'

  /notifications:
    get:
      operationId: getNotifications
      tags:
        - Notifications
      summary: Список уведомлений личного кабинета
      description: |
        Возвращает уведомления личного кабинета текущего пользователя.
        Фильтрация по типу: только `AccountNotification`.
      security:
        - cookieAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
          description: Номер страницы.
        - name: perPage
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Количество элементов на странице. Максимум — 100.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotificationPaginationResponse'
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/unread-count:
    get:
      operationId: getUnreadCount
      tags:
        - Notifications
      summary: Количество непрочитанных уведомлений
      description: |
        Возвращает количество непрочитанных уведомлений личного кабинета текущего пользователя.
        Фильтрация по типу: только `AccountNotification`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: integer
                example: 5
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /notifications/{id}/read:
    post:
      operationId: readNotification
      tags:
        - Notifications
      summary: Отметить уведомление как прочитанное
      description: |
        Отмечает конкретное уведомление личного кабинета как прочитанное.
        Уведомление должно принадлежать текущему пользователю.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID уведомления.
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          $ref: '#/components/responses/NotFoundError'

  /notifications/read-all:
    post:
      operationId: readAllNotifications
      tags:
        - Notifications
      summary: Отметить все уведомления как прочитанные
      description: |
        Отмечает все непрочитанные уведомления личного кабинета текущего пользователя как прочитанные.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'

  /users:
    post:
      operationId: createUser
      tags:
        - Users
      summary: Создание пользователя
      description: Создаёт пользователя для текущего контрагента. Доступно только пользователю с ролью director. Роль director назначить нельзя.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Forbidden
                code: ACCESS_FORBIDDEN
        '422':
          $ref: '#/components/responses/ValidationError'

  /users/{id}:
    patch:
      operationId: updateUser
      tags:
        - Users
      summary: Обновить пользователя контрагента
      description: |
        Обновляет роль и/или статус блокировки пользователя контрагента.

        Доступно только пользователю с ролью `director`.
        Целевой пользователь должен принадлежать тому же контрагенту.
        Нельзя изменить данные самому себе.

        Можно передать одно или оба поля. Роль `director` назначить нельзя.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/XSRFTokenHeader'
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID пользователя.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '204':
          description: No Content
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Forbidden
                code: ACCESS_FORBIDDEN
        '404':
          $ref: '#/components/responses/NotFoundError'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel-session
      description: Session cookie (имя может отличаться и задаётся через SESSION_COOKIE; по умолчанию laravel-session).
  parameters:
    XSRFTokenHeader:
      name: X-XSRF-TOKEN
      in: header
      required: true
      schema:
        type: string
      description: Значение CSRF-токена (обычно берётся из cookie XSRF-TOKEN после вызова /csrf-cookie).
  responses:
    UnauthorizedError:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequestsError:
      description: Too many requests
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Too many requests
            code: TOO_MANY_REQUESTS
    NotFoundError:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Not found
            code: NOT_FOUND
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
  schemas:
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        remember:
          type: boolean
          default: false

    RegisterRequest:
      type: object
      required:
        - email
        - phone
        - inn
        - fio
      properties:
        email:
          type: string
          format: email
          example: ivan@example.com
          description: Email — обязательное поле, которое в дальнейшем будет использоваться как логин для входа в личный кабинет.
        phone:
          type: string
          example: '+79991234567'
          description: Телефон — контактный номер для связи менеджера с клиентом.
        inn:
          type: string
          example: '1234567890'
          description: ИНН — первичный шаг формы. Система валидирует формат (для юрлиц или ИП) и запрашивает данные из внешнего справочника.
          minLength: 10
          maxLength: 12
          pattern: '^\\d{10}(\\d{2})?$'
        name:
          type: string
          example: 'ООО "Ромашка"'
          description: Наименование организации или ИП — подставляется автоматически после ввода ИНН и не редактируется пользователем вручную.
        kpp:
          type: string
          nullable: true
          example: '123456789'
          description: КПП — подставляется автоматически из внешнего справочника (для юрлиц) и недоступно для ручного изменения.
          minLength: 9
          maxLength: 9
          pattern: '^\\d{9}$'
        fio:
          type: string
          example: Иванов Иван Иванович
          description: Контактное лицо (ФИО) — обязательное поле.
        address:
          type: string
          nullable: true
          example: г. Москва, ул. Пушкина, д. 1
          description: Адрес — вводится при необходимости (опционально).
        comment:
          type: string
          nullable: true
          example: Позвонить после 18:00
          description: Комментарий — дополнительное текстовое поле (опционально)

    ForgotPasswordRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
          example: ivan@example.com

    ResetPasswordRequest:
      type: object
      required:
        - token
        - email
        - password
        - passwordConfirmation
      properties:
        token:
          type: string
          example: 4|pK5...
        email:
          type: string
          format: email
          example: ivan@example.com
        password:
          type: string
          format: password
        passwordConfirmation:
          type: string
          format: password

    BannerListResponse:
      type: object
      required:
        - data
